<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page introuvable, Kal Mydas</title>
<meta name="robots" content="noindex, follow" />
<style>
  :root { --bg:#060A18; --fg:#EAEAF2; --muted:#9D9DB8; --gold:#4184CC; --border:#1a1a30; --card:#0f0f1e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.7; padding: 3rem 1.5rem 5rem; min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: #fff; font-weight: 800; }
  p { color: #cfd0db; margin-bottom: 0.8rem; }
  .liens { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.5rem; }
  .btn { display: inline-block; padding: 0.7rem 1.3rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .btn-plein { background: var(--gold); color: #060610; }
  .btn-cadre { border: 1px solid var(--border); background: var(--card); color: var(--fg); }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Cette page n’existe pas.</h1>
    <p>L’adresse demandée ne correspond à aucune page de kalmydas.com.</p>
    <div class="liens">
      <a class="btn btn-plein" href="https://kalmydas.com/">Retour à l’accueil</a>
      <a class="btn btn-cadre" href="https://home.kalmydas.com/">Ouvrir l’application</a>
    </div>
  </main>
</body>
</html>
